[project]
name = "agent-videonote"
version = "0.1.0"
description = "轻量多 Agent 视频转写与图文整理 MCP 运行层"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "mcp>=1.29.0,<2",
]

[project.optional-dependencies]
asr = [
  "funasr==1.4.15",
  "qwen-asr==0.0.6",
  "torch>=2.6",
]
dev = [
  "pytest>=8",
  "ruff>=0.9",
]

[project.scripts]
agent-videonote = "agent_videonote.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_videonote"]
