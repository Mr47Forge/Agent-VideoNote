[project]
name = "agent-videonote"
version = "0.1.0"
description = "独立、模块化的多 Agent 视频转写与图文处理运行层"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
mcp = [
  "mcp>=2,<3",
]
visual-cleanup = [
  "opencv-python-headless>=4.5,<5",
]

[project.scripts]
agent-videonote-selfcheck = "agent_videonote.selfcheck:main"
agent-videonote-mcp = "agent_videonote.adapters.mcp.server:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_videonote"]
