[project]
name = "agent-videonote"
version = "0.1.0"
description = "独立、模块化的多 Agent 视频转写与图文处理运行层"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_videonote"]
