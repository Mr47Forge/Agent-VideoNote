name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core, MCP, and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mcp]"
          # numpy is not an import-time dependency of the package, but the
          # mask-outside-pixel safety test needs it; without it that test
          # silently skips (see tests/test_cleanup_providers.py).
          python -m pip install pytest "numpy>=1.26"

      - name: Compile
        run: python -m compileall -q agent_videonote tests

      - name: Test
        run: python -m pytest -q

      - name: MCP construction smoke test
        run: |
          python -c "from agent_videonote.adapters.mcp.server import create_server; mcp, container = create_server(); container.asr_registry.close_all(); print(type(mcp).__name__)"
