name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core, MCP, and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mcp]"
          python -m pip install pytest numpy Pillow

      - name: Compile
        run: python -m compileall -q agent_videonote tests

      - name: Test
        run: python -m pytest -q

      - name: MCP construction smoke test
        run: |
          python -c "from agent_videonote.adapters.mcp.server import create_server; mcp, container = create_server(); container.asr_registry.close_all(); print(type(mcp).__name__)"

      - name: Build wheel and verify packaged workflow runtime
        run: |
          python -m pip wheel . --no-deps -w dist
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/agent_videonote-*.whl")
          assert len(wheel) == 1, wheel
          expected = {
              "agent_videonote/workflow/rules/00-core.md",
              "agent_videonote/workflow/rules/10-input.md",
              "agent_videonote/workflow/rules/20-transcript.md",
              "agent_videonote/workflow/rules/30-visual.md",
              "agent_videonote/workflow/rules/40-delivery.md",
          }
          with zipfile.ZipFile(wheel[0]) as archive:
              names = set(archive.namelist())
          missing = expected - names
          assert not missing, sorted(missing)
          PY

          python -m pip install --no-deps --target wheel-smoke dist/agent_videonote-*.whl
          (
            cd /tmp
            PYTHONPATH="$GITHUB_WORKSPACE/wheel-smoke" python - <<'PY'
          from agent_videonote.workflow.context import build_workflow_context, runtime_protocol
          from agent_videonote.workflow.stages import WorkflowStage

          context = build_workflow_context(WorkflowStage.VISUAL)
          assert context["stage"] == "visual"
          assert "源内容忠实优先" in context["core_rules"]
          assert "视觉处理" in context["stage_rules"]
          assert runtime_protocol()["context_tool"] == "task_context"
          PY
          )
